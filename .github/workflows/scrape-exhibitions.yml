name: Daily Exhibition Scraper

on:
  schedule:
    # Runs at 4am Pacific Time (PST is UTC-8 and PDT is UTC-7)
    - cron: '0 11 * * *' # 4am Pacific Time = 11am UTC
  workflow_dispatch:

jobs:
  scrape_exhibitions:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python environment
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'  # Using Python 3.12

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run exhibition scraper
      run: |
        python main.py
      env:
        # Routes the venues listed in utils.py's PROXY_DOMAINS through the
        # ZenRows proxy, since their own CDN/WAF 403s this runner's IP outright
        # - see WEBSITE-53. Every other scraper ignores this; leaving the secret
        # unset just makes those fail as they did before (gracefully skipped,
        # logged, existing data kept). The free plan's credits don't stretch to
        # a daily run of all of them, so main.py (PROXIED_VENUES) refreshes
        # each about every 3 days; a manual run on a due day spends credits too.
        SCRAPER_PROXY_API_KEY: ${{ secrets.SCRAPER_PROXY_API_KEY }}

    - name: Commit and push updated data
      # Run even if a scraper crashed (that step exits non-zero on purpose so the
      # run goes red) - the other scrapers' data still needs committing.
      if: ${{ !cancelled() }}
      run: |
        git config user.name 'GitHub Actions Bot'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add docs/data/sf_events.json
        git add docs/data/la_events.json
        git add docs/data/mtl_events.json
        git add docs/data/tor_events.json
        git add docs/data/ist_events.json
        git add docs/data/db_size.csv
        git commit -m "Update exhibition data [skip ci]"  # [skip ci] prevents triggering additional workflows
        # main can advance during the ~7-min scrape (e.g. a code push); replay
        # this commit on top of it so the push isn't rejected as non-fast-forward
        # and the scraped data isn't lost.
        git pull --rebase origin main
        git push origin HEAD:main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
